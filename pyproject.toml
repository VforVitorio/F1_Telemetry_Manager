[project]
name = "f1-telemetry-manager"
version = "0.1.0"
description = "F1 telemetry Dashboard"
readme = "README.md"
authors = [
    {name = "Víctor Vega Sobral", email = "https://www.linkedin.com/in/victorvegasobral/"},
    {name = "Santiago Souto Ortega", email = "https://www.linkedin.com/in/santiagosoutoortega/"}
]

requires-python = ">=3.11,<3.13"

# Runtime dependencies use lower bounds and are pinned by uv.lock. This list
# is the complete runtime contract for the backend plus the parent strategy
# engine it imports through the shared src/ mount. CI and Docker consume this
# manifest and its lockfile directly.
dependencies = [
    "fastapi>=0.115.0,<0.137.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.35.0",
    "pydantic[email]>=2.7.4",
    "python-dotenv>=1.1.0",
    "fastf1>=3.4.0",
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.3.3,<3.0.0",
    "pyarrow>=23.0.1,<24.0.0",

    # Parent strategy engine dependencies used by backend strategy endpoints.
    "xgboost>=3.2.0,<3.5.0",
    "lightgbm>=4.6.0,<4.7.0",
    "scikit-learn>=1.5.2,<1.6.0",
    "joblib>=1.5.3",
    "torch==2.11.0+cu128; sys_platform == 'win32'",
    "torch==2.12.0+cpu; sys_platform != 'win32'",
    "transformers>=5.13.1,<5.14.0",
    "sentence-transformers==5.2.2",
    "setfit>=1.1.3,<1.2.0",
    "langchain>=1.3.9",
    "langchain-core>=1.2.0",
    "langchain-openai>=1.1.14",
    "langgraph>=1.0.10rc1",
    "qdrant-client>=1.6.0",
    "huggingface-hub>=0.20",
    "librosa>=0.11.0",
    "soundfile>=0.12.0",

    # Chat and telemetry services.
    "requests>=2.31.0",
    "plotly>=5.18.0",
    "httpx>=0.27.0,<1.0.0",

    # MCP (Model Context Protocol) server.
    "fastmcp==3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
# Keep the submodule CI lightweight. `--only-group ci` deliberately excludes
# the full runtime project and mirrors the deps-lite contract of the current
# workflow while making every version come from uv.lock.
ci = [
    "pytest>=8.4.2,<9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "requests>=2.31.0",
    "pydantic>=2.7.4,<3.0.0",
    "fastapi>=0.115.0,<0.137.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.1.0",
    "pandas>=2.2.0,<3.0.0",
    "ruff>=0.16.6,<0.17.0",
]

[tool.uv]
# Match the parent project: Linux CI and Docker use CPU wheels, while the
# Windows development machine can use the CUDA index when available.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]
